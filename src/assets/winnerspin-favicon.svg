<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">WinnerSpin</title>
  <desc id="desc">Ícone dourado de uma roleta de cinema com a letra W.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1c27"/>
      <stop offset="1" stop-color="#0b0a10"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf9e7"/>
      <stop offset=".32" stop-color="#f5cb4a"/>
      <stop offset=".7" stop-color="#e0a90e"/>
      <stop offset="1" stop-color="#9a640d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Roleta -->
  <circle cx="64" cy="64" r="47" fill="#14131b" stroke="#e0a90e" stroke-width="3"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#7f4f12" stroke-width="1.5"/>

  <!-- Divisões da roleta -->
  <g stroke="#6d4214" stroke-width="1.2" opacity=".9">
    <path d="M64 24v80"/>
    <path d="M24 64h80"/>
    <path d="M35.7 35.7l56.6 56.6"/>
    <path d="M92.3 35.7L35.7 92.3"/>
  </g>

  <!-- Ponteiro -->
  <path d="M64 10l8 13H60z" fill="url(#gold)" stroke="#f5cb4a" stroke-width="1.2" filter="url(#shadow)"/>
  <circle cx="64" cy="10" r="3.5" fill="#fdf9e7" stroke="#e0a90e" stroke-width="2"/>

  <!-- W central -->
  <path d="M38 43 L47 82 L58 59 L64 82 L70 59 L81 82 L90 43
           L79 43 L73 66 L66 45 L62 45 L55 66 L49 43 Z"
        fill="url(#gold)" stroke="#fdf9e7" stroke-width="1" filter="url(#shadow)"/>

  <!-- Película na base -->
  <path d="M20 88 Q64 108 108 88" fill="none" stroke="#e0a90e" stroke-width="5"/>
  <path d="M21 88 Q64 108 107 88" fill="none" stroke="#f5cb4a" stroke-width="1.2"/>

  <g fill="#0b0a10" stroke="#f5cb4a" stroke-width=".7">
    <rect x="27" y="90" width="5" height="3" rx=".6" transform="rotate(12 29.5 91.5)"/>
    <rect x="38" y="94" width="5" height="3" rx=".6" transform="rotate(8 40.5 95.5)"/>
    <rect x="50" y="97" width="5" height="3" rx=".6" transform="rotate(5 52.5 98.5)"/>
    <rect x="73" y="97" width="5" height="3" rx=".6" transform="rotate(-5 75.5 98.5)"/>
    <rect x="85" y="94" width="5" height="3" rx=".6" transform="rotate(-8 87.5 95.5)"/>
    <rect x="96" y="90" width="5" height="3" rx=".6" transform="rotate(-12 98.5 91.5)"/>
  </g>

  <!-- Estrelas -->
  <g fill="#f5cb4a">
    <path d="M17 51l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path d="M111 51l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/>
  </g>
</svg>